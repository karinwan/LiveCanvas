stages:
  - format-check
  - setup
  - test
  - build
  - deploy

variables:
  PYTHON_VERSION: "3.12.8"
  VITE_BASE_URL: "http://localhost:5000"
  NODE_OPTIONS: "--max-old-space-size=2048"

# Optimize cache configuration
cache:
  key: ${CI_COMMIT_REF_SLUG}-deps
  paths:
    - frontend/node_modules/
    - backend/enter/
  policy: pull-push

# Format Check
black-check:
  stage: format-check
  image: python:3.12-slim
  before_script:
    - pip install black
  script:
    - black backend

# Setup stage
setup_backend:
  stage: setup
  image: continuumio/miniconda3
  before_script:
    - echo "Starting CI/CD pipeline"
  script:
    - conda create -n ece651 python=3.12.8 -y
    - source /opt/conda/etc/profile.d/conda.sh
    - conda activate ece651
    - pip install --upgrade pip
    - pip install -r backend/requirements.txt
  artifacts:
    paths:
      - backend/enter/

setup_frontend:
  stage: setup
  image: node:22
  variables:
    GIT_STRATEGY: clone
    NODE_ENV: development
  cache:
    key: ${CI_COMMIT_REF_SLUG}-frontend-deps
    paths:
      - frontend/node_modules/
    policy: pull-push
  script:
    - cd frontend
    - npm install --include=dev --no-audit --no-fund
  artifacts:
    paths:
      - frontend/node_modules/

test_backend:
  stage: test
  image: continuumio/miniconda3
  before_script:
    - echo "Starting CI/CD pipeline"
  script:
    - source /opt/conda/etc/profile.d/conda.sh
    - conda activate ece651 || conda create -n ece651 python=3.12.8 -y && conda activate ece651
    - pip install --upgrade pip
    - pip install -r backend/requirements.txt
    - pip install pytest-cov
    - cd backend
    - pytest --cov=app tests/ --cov-report=term --cov-report=xml:coverage.xml
  coverage: '/TOTAL.+?(\d+\%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml
    paths:
      - backend/coverage.xml

# Frontend testing with coverage
test_frontend:
  stage: test
  image: node:22
  variables:
    GIT_STRATEGY: clone
  dependencies:
    - setup_frontend
  before_script:
    - echo "Starting CI/CD pipeline"
  script:
    - cd frontend
    - |
      if ! grep -q "\"test:coverage\"" package.json; then 
        sed -i 's/"scripts": {/"scripts": {\n    "test:coverage": "vitest run --coverage",/g' package.json
      fi
    - npm run test:unit || true
    - npm run test:coverage || true
    - echo "Coverage report generated, details:"
    - cat coverage/coverage-summary.json || echo "No coverage summary found"
  coverage: '/All files\s+\|\s+([0-9.]+)\s+\|/'
  artifacts:
    paths:
      - frontend/coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: frontend/coverage/cobertura-coverage.xml
  artifacts:
    paths:
      - frontend/coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: frontend/coverage/cobertura-coverage.xml

# Build stage
build_frontend:
  stage: build
  image: node:22
  variables:
    GIT_STRATEGY: clone
  dependencies:
    - setup_frontend
  script:
    - cd frontend
    - export PATH=$PATH:./node_modules/.bin
    - npm run build
  artifacts:
    paths:
      - frontend/dist/

# Build backend
build_backend:
  stage: build
  image: python:3.12-slim
  script:
    - echo "Preparing backend for deployment..."
    - cd backend
    - mkdir -p build
    - cp -r app build/
    - cp -r static build/ || echo "No static directory"
    - cp run.py build/
    - cp requirements.txt build/
    # Create deployment script
    - echo "Creating startup file..."
    - echo "gunicorn --bind=0.0.0.0 --timeout 600 run:app" > build/startup.txt
  artifacts:
    paths:
      - backend/build/

# Deploy stage for Azure Static Web App
deploy_to_azure_static_web_app:
  stage: deploy
  image: node:22
  variables:
    AZURE_STATIC_SITE_NAME: "LiveCanvas"
  dependencies:
    - build_frontend
  before_script:
    - echo "Starting CI/CD pipeline"
  script:
    - echo "Deploying frontend to Azure Static Web App..."
    - cd frontend
    - npm install -g @azure/static-web-apps-cli
    - echo "Deploying with SWA CLI..."
    - swa deploy ./dist --deployment-token $AZURE_DEPLOYMENT_TOKEN --env production
  only:
    - main
  environment:
    name: production
    url: https://victorious-ground-0e3a36a0f.6.azurestaticapps.net

# Deploy backend to Azure Web App
deploy_to_azure_webapp:
  stage: deploy
  image: alpine:latest
  dependencies:
    - build_backend
  before_script:
    - apk add --no-cache curl git zip
    - echo "Starting backend deployment to Azure Web App..."
  script:
    - cd backend/build
    - zip -r site.zip *
    - echo "Deploying to Azure Web App using deployment credentials..."
    - >
      curl -X POST -u "$LiveCanvas:$AZURE_WEBAPP_PASSWORD" 
      --data-binary @site.zip 
      https://livecanvas-fjancxf4czdbcjg0.scm.canadacentral-01.azurewebsites.net/api/zipdeploy
    - echo "Backend deployment completed."
  only:
    - main
  environment:
    name: production
    url: https://livecanvas-fjancxf4czdbcjg0.canadacentral-01.azurewebsites.net